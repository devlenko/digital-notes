<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Notes</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/7.3.1/css/all.min.css" integrity="sha512-QeR2VH+lsBE5LSAe1Q5EnTBbe7XTBubt8dG93Y7gidSgdMCr8nVqKcfKAMyN96SV8KDbZVTDXChatu5G2KQGzg==" crossorigin="anonymous" referrerpolicy="no-referrer">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="note-group"></div>

    <div class="main-btn-group">
        <button type="button" id="add-note-btn" class="main-btn" aria-label="Add Note">
            <i class="fa-solid fa-plus" aria-hidden="true" role="img"></i>
        </button>
        <button type="button" id="delete-all-btn" class="main-btn" aria-label="Delete All Notes">
            <i class="fa-solid fa-trash-can" aria-hidden="true" role="img"></i>
        </button>
    </div>

    <dialog id="modal">
        <p>Are you sure you want to delete all notes? <strong>This cannot be undone.</strong></p>
        <div class="modal-btn-group">
            <button type="button" id="cancel-delete-btn" class="modal-btn">Cancel</button>
            <button type="button" id="confirm-delete-btn" class="modal-btn">OK</button> 
        </div>
    </dialog>

    <script src="script.js"></script>
</body>

</html>
